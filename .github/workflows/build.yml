name: Build HomeCam APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p $RUNNER_TEMP/proj && cd $RUNNER_TEMP/proj
          mkdir -p app
          cat > app/build.gradle.kts <<'HOMECAM_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "bd.homecam"
              compileSdk = 34

              defaultConfig {
                  applicationId = "bd.homecam"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-video:1.3.4")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          HOMECAM_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'HOMECAM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="HomeCam"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CameraService"
                      android:exported="false"
                      android:foregroundServiceType="camera|microphone|mediaProjection" />

                  <service
                      android:name=".WatchdogJob"
                      android:exported="false"
                      android:permission="android.permission.BIND_JOB_SERVICE" />
              </application>
          </manifest>
          HOMECAM_EOF
          mkdir -p app/src/main/java/bd/homecam
          cat > app/src/main/java/bd/homecam/CameraService.kt <<'HOMECAM_EOF'
          package bd.homecam

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.Image
          import android.media.ImageReader
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.wifi.WifiManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.util.Size
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.FallbackStrategy
          import androidx.camera.video.FileOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.core.app.ServiceCompat
          import androidx.core.content.ContextCompat
          import androidx.core.content.IntentCompat
          import androidx.lifecycle.LifecycleService
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.math.abs

          class CameraService : LifecycleService() {

              companion object {
                  const val ACTION_STOP = "bd.homecam.STOP"
                  const val ACTION_SCREEN = "bd.homecam.SCREEN"
                  @Volatile var running = false
                  private const val CHANNEL = "homecam"
                  private const val GRID_W = 80
                  private const val GRID_H = 60
              }

              private lateinit var tg: Telegram
              private val main = Handler(Looper.getMainLooper())
              private val io: ExecutorService = Executors.newSingleThreadExecutor()
              private val analyzerExec: ExecutorService = Executors.newSingleThreadExecutor()
              private var provider: ProcessCameraProvider? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var poller: Thread? = null
              private var camera: Camera? = null
              private var torchOn = false
              private val liveBusy = AtomicBoolean(false)
              @Volatile private var liveUntil = 0L
              @Volatile private var liveMsgId = 0L
              @Volatile private var quietUntil = 0L
              private var lastLive = 0L
              private var recorder: MediaRecorder? = null
              private var chunkEnd: Runnable? = null
              @Volatile private var listenUntil = 0L

              // screen sharing (MediaProjection)
              @Volatile private var projection: MediaProjection? = null
              private var vDisplay: VirtualDisplay? = null
              private var imgReader: ImageReader? = null
              private var heldImage: Image? = null
              @Volatile private var screenLiveUntil = 0L
              @Volatile private var screenMsgId = 0L
              private val screenBusy = AtomicBoolean(false)
              private var lastScreenLive = 0L

              // keep-alive helpers
              private var wifiLock: WifiManager.WifiLock? = null
              @Volatile private var lastFrameAt = 0L
              @Volatile private var camStuckNotified = false
              private var lastRebind = 0L

              @Volatile private var armed = true
              @Volatile private var sens = 60
              @Volatile private var wantPhoto = false
              @Volatile private var lastMotion = 0L
              @Volatile private var forceRecordUntil = 0L
              private var lastAlert = 0L
              private var recStart = 0L
              private var startedAt = 0L
              private var lastProc = 0L
              private var hits = 0
              private var prev: ByteArray? = null

              private val powerReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      val b = batteryPercent()
                      when (i.action) {
                          Intent.ACTION_POWER_DISCONNECTED ->
                              notifyText("⚡ বিদ্যুৎ চলে গেছে। ফোন এখন ব্যাটারিতে চলছে ($b%)।")
                          Intent.ACTION_POWER_CONNECTED ->
                              notifyText("🔌 বিদ্যুৎ ফিরে এসেছে। ব্যাটারি $b%।")
                          Intent.ACTION_BATTERY_LOW ->
                              notifyText("🪫 ব্যাটারি কমে গেছে ($b%)। ফোন যেকোনো সময় বন্ধ হতে পারে।")
                      }
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  if (intent?.action == ACTION_STOP) {
                      getSharedPreferences("cfg", MODE_PRIVATE).edit().putBoolean("wanted", false).apply()
                      WatchdogJob.cancel(this)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (intent?.action == ACTION_SCREEN) {
                      handleScreenIntent(intent)
                      return START_NOT_STICKY
                  }
                  if (running) return START_NOT_STICKY

                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  val token = p.getString("token", "") ?: ""
                  val chat = p.getString("chat", "") ?: ""
                  if (token.isEmpty() || chat.isEmpty()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  tg = Telegram(token, chat)
                  sens = p.getInt("sens", 60)
                  armed = p.getBoolean("auto", false)
                  cacheDir.listFiles()?.forEach { if (it.name.startsWith("clip_")) it.delete() }

                  createChannel()
                  var fgType = ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                  if (hasMic()) fgType = fgType or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  ServiceCompat.startForeground(this, 1, buildNotification(), fgType)
                  running = true
                  startedAt = System.currentTimeMillis()
                  lastFrameAt = startedAt
                  p.edit().putBoolean("wanted", true).apply()
                  WatchdogJob.schedule(this)

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "homecam:svc").also { it.acquire() }
                  try {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      @Suppress("DEPRECATION")
                      val mode = if (Build.VERSION.SDK_INT >= 29) WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                      else WifiManager.WIFI_MODE_FULL_HIGH_PERF
                      wifiLock = wm.createWifiLock(mode, "homecam:wifi").also { it.acquire() }
                  } catch (e: Exception) {
                      // not critical
                  }

                  val f = IntentFilter().apply {
                      addAction(Intent.ACTION_POWER_CONNECTED)
                      addAction(Intent.ACTION_POWER_DISCONNECTED)
                      addAction(Intent.ACTION_BATTERY_LOW)
                  }
                  registerReceiver(powerReceiver, f)

                  startCamera(p.getBoolean("front", false))
                  startPolling()
                  main.postDelayed(ticker, 1000)
                  return START_NOT_STICKY
              }

              // ---------------------------------------------------------------- camera

              private fun startCamera(front: Boolean, quiet: Boolean = false) {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val prov = future.get()
                          provider = prov
                          val selector = if (front) CameraSelector.DEFAULT_FRONT_CAMERA else CameraSelector.DEFAULT_BACK_CAMERA

                          val analysis = ImageAnalysis.Builder()
                              .setTargetResolution(Size(1280, 720))
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()
                          analysis.setAnalyzer(analyzerExec) { img -> analyze(img) }

                          val vrec = Recorder.Builder()
                              .setQualitySelector(
                                  QualitySelector.from(Quality.SD, FallbackStrategy.higherQualityOrLowerThan(Quality.SD))
                              )
                              .build()
                          val video = VideoCapture.withOutput(vrec)

                          prov.unbindAll()
                          try {
                              camera = prov.bindToLifecycle(this, selector, analysis, video)
                              videoCapture = video
                          } catch (e: Exception) {
                              prov.unbindAll()
                              camera = prov.bindToLifecycle(this, selector, analysis)
                              videoCapture = null
                              if (!quiet) notifyText("ℹ️ এই ফোনে ভিডিও রেকর্ডিং চলে না, শুধু ছবি পাঠানো হবে।")
                          }
                          if (!quiet) {
                              val b = batteryPercent()
                              val mode = if (armed) "নড়াচড়া হলে নিজে থেকে ছবি ও ভিডিও আসবে" else "আপনি চাইলে তবেই ছবি/ভিডিও আসবে"
                              notifyText("✅ HomeCam চালু হয়েছে। ব্যাটারি $b%।\n$mode\n/live লাইভ ছবি, /listen আশপাশের শব্দ শোনা, /stop বন্ধ\n/screen ফোনের স্ক্রিনশট, /screenlive চলমান স্ক্রিন\n/flash ফ্ল্যাশ চালু-বন্ধ\nফোনে কিছু বলতে বটে ভয়েস মেসেজ পাঠান\n/photo ছবি, /video ভিডিও, /status অবস্থা\n/arm নিজে থেকে পাঠানো চালু, /disarm বন্ধ")
                          }
                      } catch (e: Exception) {
                          notifyText("❌ ক্যামেরা চালু করা যায়নি: ${e.message}")
                          if (!quiet) stopSelf()
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun analyze(image: ImageProxy) {
                  try {
                      val now = System.currentTimeMillis()
                      lastFrameAt = now
                      if (camStuckNotified) {
                          camStuckNotified = false
                          notifyText("✅ ক্যামেরা আবার ঠিকমতো চলছে।")
                      }
                      if (now - lastProc < 250) return
                      lastProc = now

                      val plane = image.planes[0]
                      val buf = plane.buffer
                      val rs = plane.rowStride
                      val ps = plane.pixelStride
                      val w = image.width
                      val h = image.height

                      if (now < liveUntil && now - lastLive >= 2500 && liveBusy.compareAndSet(false, true)) {
                          lastLive = now
                          val jpeg = toJpeg(image, 640, 60)
                          if (jpeg == null) {
                              liveBusy.set(false)
                          } else {
                              val cap = "🔴 LIVE " + stamp()
                              io.execute {
                                  try {
                                      val id = liveMsgId
                                      if (id == 0L || !tg.editPhoto(id, jpeg, cap)) {
                                          liveMsgId = tg.sendPhotoId(jpeg, cap) ?: 0L
                                      }
                                  } finally {
                                      liveBusy.set(false)
                                  }
                              }
                          }
                      }

                      val cur = ByteArray(GRID_W * GRID_H)
                      for (y in 0 until GRID_H) {
                          val row = y * h / GRID_H
                          for (x in 0 until GRID_W) {
                              cur[y * GRID_W + x] = buf.get(row * rs + (x * w / GRID_W) * ps)
                          }
                      }

                      val old = prev
                      prev = cur
                      if (old == null) return
                      if (now - startedAt < 4000) return // camera exposure settling
                      if (now < quietUntil) { hits = 0; return } // flash just toggled

                      var changed = 0
                      for (i in cur.indices) {
                          val d = abs((cur[i].toInt() and 0xFF) - (old[i].toInt() and 0xFF))
                          if (d > 25) changed++
                      }
                      val pct = changed * 100.0 / cur.size
                      val need = 8.0 - sens * 0.075

                      val takePhoto = wantPhoto
                      val motion: Boolean
                      if (pct > need && pct < 70.0) hits++ else hits = 0
                      motion = hits >= 2

                      if (motion) lastMotion = now

                      val alert = motion && armed && now - lastAlert > 20000
                      if (alert || takePhoto) {
                          wantPhoto = false
                          val jpeg = toJpeg(image)
                          if (alert) lastAlert = now
                          val label = stamp()
                          if (jpeg != null) {
                              io.execute {
                                  tg.sendPhoto(jpeg, if (alert) "🚨 নড়াচড়া ধরা পড়েছে\n$label" else "📷 $label")
                              }
                          }
                          if (alert) main.post { startRecording() }
                      }
                  } catch (e: Exception) {
                      // skip this frame
                  } finally {
                      image.close()
                  }
              }

              private fun toJpeg(image: ImageProxy, maxW: Int = 0, quality: Int = 80): ByteArray? {
                  return try {
                      val bmp = image.toBitmap()
                      val rot = image.imageInfo.rotationDegrees
                      val out = if (rot != 0) {
                          val m = Matrix().apply { postRotate(rot.toFloat()) }
                          Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                      } else bmp
                      val fin = if (maxW > 0 && out.width > maxW) {
                          Bitmap.createScaledBitmap(out, maxW, out.height * maxW / out.width, true)
                      } else out
                      val bos = ByteArrayOutputStream()
                      fin.compress(Bitmap.CompressFormat.JPEG, quality, bos)
                      bos.toByteArray()
                  } catch (e: Exception) {
                      null
                  }
              }

              // -------------------------------------------------------------- recording

              private fun startRecording() {
                  val vc = videoCapture ?: return
                  if (recording != null) return
                  val file = File(cacheDir, "clip_${System.currentTimeMillis()}.mp4")
                  val caption = "🎥 " + stamp()
                  try {
                      recStart = System.currentTimeMillis()
                      recording = vc.output
                          .prepareRecording(this, FileOutputOptions.Builder(file).build())
                          .start(ContextCompat.getMainExecutor(this)) { ev ->
                              if (ev is VideoRecordEvent.Finalize) {
                                  recording = null
                                  if (!ev.hasError() && file.exists() && file.length() > 0) {
                                      io.execute {
                                          tg.sendVideo(file, caption)
                                          file.delete()
                                      }
                                  } else {
                                      file.delete()
                                  }
                              }
                          }
                  } catch (e: Exception) {
                      recording = null
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      val t = System.currentTimeMillis()
                      if (liveUntil != 0L && t > liveUntil) {
                          liveUntil = 0L
                          notifyText("⏹ ৩ মিনিট হয়ে গেছে, লাইভ বন্ধ। আবার দেখতে /live লিখুন।")
                      }
                      if (screenLiveUntil != 0L && t > screenLiveUntil) {
                          screenLiveUntil = 0L
                          notifyText("⏹ স্ক্রিন লাইভ শেষ। আবার দেখতে /screenlive লিখুন।")
                      }
                      if (t < screenLiveUntil && t - lastScreenLive >= 2000 && screenBusy.compareAndSet(false, true)) {
                          lastScreenLive = t
                          val j = screenJpeg()
                          if (j == null) {
                              screenBusy.set(false)
                          } else {
                              val cap = "🖥 LIVE " + stamp()
                              io.execute {
                                  try {
                                      val id = screenMsgId
                                      if (id == 0L || !tg.editPhoto(id, j, cap)) {
                                          screenMsgId = tg.sendPhotoId(j, cap) ?: 0L
                                      }
                                  } finally {
                                      screenBusy.set(false)
                                  }
                              }
                          }
                      }
                      // keep-alive checks: restart the Telegram listener or the camera if either got stuck
                      if (poller?.isAlive != true) startPolling()
                      if (t - lastFrameAt > 30000 && t - startedAt > 30000 && t - lastRebind > 60000) {
                          lastRebind = t
                          if (!camStuckNotified) {
                              camStuckNotified = true
                              notifyText("⚠️ ক্যামেরা থেকে ছবি আসছে না। আবার চালু করার চেষ্টা করছি।")
                          }
                          startCamera(getSharedPreferences("cfg", MODE_PRIVATE).getBoolean("front", false), true)
                      }
                      val r = recording
                      if (r != null) {
                          val now = System.currentTimeMillis()
                          val quiet = now - lastMotion > 10000 && now > forceRecordUntil
                          val tooLong = now - recStart > 45000
                          if (quiet || tooLong) {
                              r.stop()
                          }
                      }
                      if (running) main.postDelayed(this, 1000)
                  }
              }

              // --------------------------------------------------------------- telegram

              private fun startPolling() {
                  poller = Thread {
                      var offset = 0L
                      tg.getUpdates(-1, 0)?.let { arr ->
                          if (arr.length() > 0) offset = arr.getJSONObject(arr.length() - 1).getLong("update_id") + 1
                      }
                      while (running) {
                          val ups = tg.getUpdates(offset, 25)
                          if (ups == null) {
                              try { Thread.sleep(5000) } catch (e: InterruptedException) { return@Thread }
                              continue
                          }
                          for (i in 0 until ups.length()) {
                              try {
                                  val u = ups.getJSONObject(i)
                                  offset = u.getLong("update_id") + 1
                                  val msg = u.optJSONObject("message") ?: continue
                                  val from = msg.getJSONObject("chat").getLong("id").toString()
                                  if (from != tg.chat) continue // ignore strangers
                                  val voice = msg.optJSONObject("voice")
                                  if (voice != null) {
                                      playIncoming(voice.getString("file_id"))
                                  } else {
                                      handleCommand((msg.optString("text", "")).trim().lowercase(Locale.ROOT))
                                  }
                              } catch (e: Exception) {
                                  // one bad message must never stop the bot
                              }
                          }
                      }
                  }.also { it.isDaemon = true; it.start() }
              }

              private fun handleCommand(cmd: String) {
                  when {
                      cmd.startsWith("/photo") -> wantPhoto = true
                      cmd.startsWith("/flash") -> setTorch(cmd)
                      cmd.startsWith("/live") -> {
                          liveMsgId = 0L
                          liveUntil = System.currentTimeMillis() + 180000
                          notifyText("🔴 লাইভ শুরু হচ্ছে। প্রতি ২-৩ সেকেন্ডে ছবি বদলাবে। ৩ মিনিট পর নিজে বন্ধ হবে। আগে বন্ধ করতে /stop।")
                      }
                      cmd.startsWith("/listen") -> startListening()
                      cmd.startsWith("/screenlive") -> {
                          if (projection == null) {
                              notifyNoScreen()
                          } else {
                              wakeScreen(180000)
                              screenMsgId = 0L
                              screenLiveUntil = System.currentTimeMillis() + 180000
                              notifyText("🖥 স্ক্রিন লাইভ শুরু। ৩ মিনিট পর নিজে বন্ধ হবে, আগে বন্ধ করতে /stop।")
                          }
                      }
                      cmd.startsWith("/screen") -> {
                          if (projection == null) {
                              notifyNoScreen()
                          } else {
                              wakeScreen(8000)
                              main.postDelayed({
                                  val j = screenJpeg()
                                  if (j == null) notifyText("❌ স্ক্রিনের ছবি পাওয়া যায়নি, আবার চেষ্টা করুন।")
                                  else io.execute { tg.sendPhoto(j, "🖥 " + stamp()) }
                              }, 1500)
                          }
                      }
                      cmd.startsWith("/stop") -> {
                          liveUntil = 0L
                          screenLiveUntil = 0L
                          listenUntil = 0L
                          main.post { chunkEnd?.let { main.removeCallbacks(it); it.run() } }
                          notifyText("⏹ লাইভ ও শোনা বন্ধ।")
                      }
                      cmd.startsWith("/video") -> {
                          if (videoCapture == null) {
                              notifyText("এই ফোনে ভিডিও রেকর্ডিং চলে না।")
                          } else {
                              forceRecordUntil = System.currentTimeMillis() + 15000
                              main.post { startRecording() }
                          }
                      }
                      cmd.startsWith("/disarm") -> { armed = false; notifyText("🔕 নিজে থেকে ছবি/ভিডিও বন্ধ। এখন শুধু /photo ও /video দিলে আসবে।") }
                      cmd.startsWith("/arm") -> { armed = true; notifyText("🔔 এখন থেকে নড়াচড়া হলে নিজে থেকে ছবি ও ভিডিও আসবে।") }
                      cmd.startsWith("/status") -> {
                          val charging = isCharging()
                          notifyText(
                              "📊 অবস্থা\nব্যাটারি: ${batteryPercent()}% (${if (charging) "চার্জ হচ্ছে" else "বিদ্যুৎ নেই"})\n" +
                                  "নিজে থেকে ছবি/ভিডিও: ${if (armed) "চালু" else "বন্ধ"}\nফ্ল্যাশ: ${if (torchOn) "চালু" else "বন্ধ"}\nসময়: ${stamp()}"
                          )
                      }
                      cmd.startsWith("/start") || cmd.startsWith("/help") ->
                          notifyText("/live লাইভ দেখা\n/listen আশপাশের শব্দ শোনা\n/screen ফোনের স্ক্রিনশট\n/screenlive চলমান স্ক্রিন\nফোনে কিছু বলতে বটে ভয়েস মেসেজ পাঠান\n/stop লাইভ ও শোনা বন্ধ\n/flash ফ্ল্যাশ চালু-বন্ধ (/flash on, /flash off)\n/photo ছবি\n/video ১৫ সেকেন্ডের ভিডিও\n/status অবস্থা\n/arm নড়াচড়ায় নিজে থেকে পাঠানো চালু\n/disarm বন্ধ")
                  }
              }

              // ----------------------------------------------------------- screen sharing

              private fun notifyNoScreen() {
                  notifyText("স্ক্রিন শেয়ার চালু নেই। ক্যামেরা ফোনে অ্যাপ খুলে \"স্ক্রিন দেখার সুবিধা\" সুইচ চালু করে \"চালু করো\" চাপুন, আর স্ক্রিন শেয়ারের অনুমতি দিন।")
              }

              private fun handleScreenIntent(intent: Intent) {
                  val code = intent.getIntExtra("code", 0)
                  val data = IntentCompat.getParcelableExtra(intent, "data", Intent::class.java)
                  var type = ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                  if (running) {
                      type = type or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                      if (hasMic()) type = type or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  }
                  try {
                      createChannel()
                      ServiceCompat.startForeground(this, 1, buildNotification(), type)
                  } catch (e: Exception) {
                      if (!running) stopSelf()
                      return
                  }
                  if (!running || data == null) {
                      if (!running) stopSelf()
                      return
                  }
                  attachScreen(code, data)
              }

              private fun attachScreen(code: Int, data: Intent) {
                  try {
                      detachScreen()
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val mp = mpm.getMediaProjection(code, data)
                      mp.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              main.post {
                                  if (projection != null) {
                                      detachScreen()
                                      notifyText("🖥 স্ক্রিন শেয়ার বন্ধ হয়ে গেছে। আবার চালু করতে অ্যাপ খুলে \"চালু করো\" চাপুন।")
                                  }
                              }
                          }
                      }, main)
                      val dm = resources.displayMetrics
                      val f = minOf(1f, 1280f / maxOf(dm.widthPixels, dm.heightPixels))
                      val w = (dm.widthPixels * f).toInt()
                      val h = (dm.heightPixels * f).toInt()
                      val reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                      reader.setOnImageAvailableListener({ r ->
                          val img = try { r.acquireLatestImage() } catch (e: Exception) { null }
                          if (img != null) {
                              heldImage?.close()
                              heldImage = img
                          }
                      }, main)
                      vDisplay = mp.createVirtualDisplay(
                          "homecam", w, h, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          reader.surface, null, null
                      )
                      imgReader = reader
                      projection = mp
                      notifyText("🖥 স্ক্রিন শেয়ার চালু। /screen স্ক্রিনশট, /screenlive চলমান স্ক্রিন।")
                  } catch (e: Exception) {
                      detachScreen()
                      notifyText("❌ স্ক্রিন শেয়ার চালু করা যায়নি: ${e.message}")
                  }
              }

              private fun detachScreen() {
                  val p = projection
                  projection = null
                  screenLiveUntil = 0L
                  try { heldImage?.close() } catch (e: Exception) {}
                  heldImage = null
                  try { vDisplay?.release() } catch (e: Exception) {}
                  vDisplay = null
                  try { imgReader?.close() } catch (e: Exception) {}
                  imgReader = null
                  try { p?.stop() } catch (e: Exception) {}
              }

              /** Turns the screen on for a while so the capture shows something. */
              @Suppress("DEPRECATION")
              private fun wakeScreen(ms: Long) {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val wl = pm.newWakeLock(
                          PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP,
                          "homecam:screen"
                      )
                      wl.acquire(ms)
                  } catch (e: Exception) {
                      // ignore
                  }
              }

              /** Must run on the main thread: converts the newest screen frame to a JPEG. */
              private fun screenJpeg(): ByteArray? {
                  val img = heldImage ?: return null
                  return try {
                      val pl = img.planes[0]
                      val buf = pl.buffer
                      buf.rewind()
                      val bw = pl.rowStride / pl.pixelStride
                      val bmp = Bitmap.createBitmap(bw, img.height, Bitmap.Config.ARGB_8888)
                      bmp.copyPixelsFromBuffer(buf)
                      val fin = if (bw != img.width) Bitmap.createBitmap(bmp, 0, 0, img.width, img.height) else bmp
                      val bos = ByteArrayOutputStream()
                      fin.compress(Bitmap.CompressFormat.JPEG, 80, bos)
                      bos.toByteArray()
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun hasMic(): Boolean =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              /** Records 10 second pieces of what the phone hears and sends each one to Telegram. */
              private fun startListening() {
                  if (!hasMic()) {
                      notifyText("মাইকের অনুমতি দেওয়া নেই। ফোনের অ্যাপ সেটিংসে HomeCam এ Microphone চালু করে অ্যাপটা আবার চালু করুন।")
                      return
                  }
                  listenUntil = System.currentTimeMillis() + 120000
                  notifyText("🎧 শোনা শুরু। প্রতি ১০ সেকেন্ডের শব্দ ভয়েস মেসেজ হয়ে আসবে। ২ মিনিট পর নিজে বন্ধ হবে, আগে বন্ধ করতে /stop।")
                  main.post { if (recorder == null) recordChunk() }
              }

              private fun recordChunk() {
                  if (!running || System.currentTimeMillis() >= listenUntil) return
                  val ogg = Build.VERSION.SDK_INT >= 29
                  val f = File(cacheDir, "audio_${System.currentTimeMillis()}." + (if (ogg) "ogg" else "m4a"))
                  try {
                      @Suppress("DEPRECATION")
                      val r = if (Build.VERSION.SDK_INT >= 31) MediaRecorder(this) else MediaRecorder()
                      r.setAudioSource(MediaRecorder.AudioSource.MIC)
                      if (ogg) {
                          r.setOutputFormat(MediaRecorder.OutputFormat.OGG)
                          r.setAudioEncoder(MediaRecorder.AudioEncoder.OPUS)
                          r.setAudioEncodingBitRate(24000)
                      } else {
                          r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                          r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          r.setAudioEncodingBitRate(32000)
                      }
                      r.setAudioSamplingRate(16000)
                      r.setOutputFile(f.absolutePath)
                      r.prepare()
                      r.start()
                      recorder = r
                      val end = Runnable { finishChunk(f, ogg) }
                      chunkEnd = end
                      main.postDelayed(end, 10000)
                  } catch (e: Exception) {
                      recorder = null
                      f.delete()
                      listenUntil = 0L
                      notifyText("❌ মাইক চালু করা যায়নি: ${e.message}")
                  }
              }

              private fun finishChunk(f: File, ogg: Boolean) {
                  val r = recorder
                  recorder = null
                  chunkEnd = null
                  var ok = true
                  try { r?.stop() } catch (e: RuntimeException) { ok = false }
                  try { r?.release() } catch (e: Exception) {}
                  if (ok && f.exists() && f.length() > 0) {
                      val cap = "🎧 " + stamp()
                      io.execute {
                          if (ogg) tg.sendVoice(f, cap) else tg.sendAudio(f, cap)
                          f.delete()
                      }
                  } else {
                      f.delete()
                  }
                  if (running && System.currentTimeMillis() < listenUntil) {
                      recordChunk()
                  } else if (listenUntil != 0L) {
                      listenUntil = 0L
                      notifyText("🎧 শোনা শেষ। আবার শুনতে /listen লিখুন।")
                  }
              }

              /** Plays a voice message sent by the owner through the phone's speaker. */
              private fun playIncoming(fileId: String) {
                  val f = File(cacheDir, "in_${System.currentTimeMillis()}.ogg")
                  if (!tg.downloadFile(fileId, f)) {
                      notifyText("❌ ভয়েস মেসেজটা নামানো যায়নি।")
                      return
                  }
                  main.post {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0)
                          val mp = MediaPlayer()
                          mp.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          mp.setDataSource(f.absolutePath)
                          mp.setOnCompletionListener { it.release(); f.delete() }
                          mp.setOnErrorListener { m, _, _ -> m.release(); f.delete(); true }
                          mp.prepare()
                          mp.start()
                          notifyText("🔊 আপনার কথা ফোনে বাজানো হচ্ছে।")
                      } catch (e: Exception) {
                          f.delete()
                          notifyText("❌ বাজানো যায়নি: ${e.message}")
                      }
                  }
              }

              private fun setTorch(cmd: String) {
                  val cam = camera
                  if (cam == null || !cam.cameraInfo.hasFlashUnit()) {
                      notifyText("এই ক্যামেরায় ফ্ল্যাশ নেই (সামনের ক্যামেরায় সাধারণত থাকে না)।")
                      return
                  }
                  val on = when {
                      cmd.contains(" on") -> true
                      cmd.contains(" off") -> false
                      else -> !torchOn
                  }
                  torchOn = on
                  quietUntil = System.currentTimeMillis() + 3000
                  main.post { cam.cameraControl.enableTorch(on) }
                  notifyText(if (on) "🔦 ফ্ল্যাশ চালু।" else "ফ্ল্যাশ বন্ধ।")
              }

              private fun notifyText(t: String) {
                  io.execute { tg.sendText(t) }
              }

              // ---------------------------------------------------------------- helpers

              private fun stamp(): String =
                  SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())

              private fun batteryPercent(): Int {
                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  return bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
              }

              private fun isCharging(): Boolean {
                  val i = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val s = i?.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) ?: 0
                  return s != 0
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "HomeCam", NotificationManager.IMPORTANCE_LOW)
                  )
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, CameraService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, CHANNEL)
                      .setContentTitle("HomeCam চালু আছে")
                      .setContentText("নড়াচড়া পাহারা দিচ্ছে")
                      .setSmallIcon(R.drawable.ic_stat_cam)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(null, "বন্ধ করো", stop).build())
                      .build()
              }

              override fun onDestroy() {
                  val wasRunning = running
                  running = false
                  main.removeCallbacks(ticker)
                  try { recording?.stop() } catch (e: Exception) {}
                  listenUntil = 0L
                  detachScreen()
                  try { wifiLock?.let { if (it.isHeld) it.release() } } catch (e: Exception) {}
                  try { recorder?.stop() } catch (e: Exception) {}
                  try { recorder?.release() } catch (e: Exception) {}
                  try { provider?.unbindAll() } catch (e: Exception) {}
                  try { unregisterReceiver(powerReceiver) } catch (e: Exception) {}
                  try { wakeLock?.let { if (it.isHeld) it.release() } } catch (e: Exception) {}
                  analyzerExec.shutdown()
                  if (wasRunning) io.execute { tg.sendText("⏹ HomeCam বন্ধ হয়েছে।") }
                  io.shutdown()
                  super.onDestroy()
              }
          }
