          package bd.homecam

          import android.app.job.JobInfo
          import android.app.job.JobParameters
          import android.app.job.JobScheduler
          import android.app.job.JobService
          import android.content.ComponentName
          import android.content.Context

          /**
           * Runs about every 15 minutes, even after the phone restarts. If the user wants HomeCam running
           * but the camera service is not running (phone restarted, or the system closed the app), it
           * sends a Telegram message so the owner knows to open the app again.
           */
          class WatchdogJob : JobService() {

              companion object {
                  const val JOB_ID = 77

                  fun schedule(ctx: Context) {
                      try {
                          val js = ctx.getSystemService(Context.JOB_SCHEDULER_SERVICE) as JobScheduler
                          if (js.getPendingJob(JOB_ID) != null) return
                          val info = JobInfo.Builder(JOB_ID, ComponentName(ctx, WatchdogJob::class.java))
                              .setPeriodic(15 * 60 * 1000L)
                              .setPersisted(true)
                              .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                              .build()
                          js.schedule(info)
                      } catch (e: Exception) {
                          // watchdog is a bonus, ignore failures
                      }
                  }

                  fun cancel(ctx: Context) {
                      try {
                          (ctx.getSystemService(Context.JOB_SCHEDULER_SERVICE) as JobScheduler).cancel(JOB_ID)
                      } catch (e: Exception) {
                      }
                  }
              }

              override fun onStartJob(params: JobParameters): Boolean {
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  if (!p.getBoolean("wanted", false) || CameraService.running) return false
                  val now = System.currentTimeMillis()
                  if (now - p.getLong("lastWatchdog", 0L) < 30 * 60 * 1000L) return false
                  val token = p.getString("token", "") ?: ""
                  val chat = p.getString("chat", "") ?: ""
                  if (token.isEmpty() || chat.isEmpty()) return false
                  p.edit().putLong("lastWatchdog", now).apply()
                  Thread {
                      Telegram(token, chat).sendText(
                          "⚠️ HomeCam বন্ধ হয়ে আছে। ফোন রিস্টার্ট হয়েছে বা সিস্টেম অ্যাপটা বন্ধ করে দিয়েছে।\n" +
                              "ক্যামেরা ফোনে অ্যাপ খুলে \"চালু করো\" চাপুন।"
                      )
                      jobFinished(params, false)
                  }.start()
                  return true
              }

              override fun onStopJob(params: JobParameters): Boolean = false
          }
